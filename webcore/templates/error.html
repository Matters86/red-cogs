{% extends "base.html" %}
{% block content %}
<div class="card-x" style="max-width:560px">
  <div style="display:flex;gap:14px;align-items:flex-start">
    <div class="wc-intro-icon" style="background:var(--danger-soft);color:var(--danger)"><i class="bi {{ icon or 'bi-exclamation-triangle' }}"></i></div>
    <div>
      <p style="color:var(--text);margin:4px 0 14px">{{ message }}</p>
      <a class="btn-ghost" href="{{ home_href|default('/') }}"><i class="bi bi-arrow-left"></i> {{ home_label|default('Zurück zur Übersicht') }}</a>
    </div>
  </div>
</div>
{% endblock %}
